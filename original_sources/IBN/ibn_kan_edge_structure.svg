<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1140" viewBox="0 0 1120 1140" role="img" aria-labelledby="title desc">
<title id="title">IBN 后的 P3 接单层 KAN 与边缘分支</title><desc id="desc">原 IBN 模型冻结。P3 经过 KAN 残差相加，再经过边缘残差相加，送入原分类器。边界头提供辅助损失。只有一层 KAN。</desc>
<!-- 【新增 IBN-KE-07】与原 KAN+edge 接入顺序一致。 -->
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#53687b"/></marker>
<style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#183047}.t{font-size:28px;font-weight:700}.h{font-size:19px;font-weight:600}.s{font-size:16px}.m{font-family:Consolas,monospace;font-size:16px}.w{fill:none;stroke:#53687b;stroke-width:2;marker-end:url(#a)}.b{fill:white;stroke:#b4c7d5;stroke-width:1.7}.k{fill:#e4f2fc;stroke:#327bae;stroke-width:2}.e{fill:#fff0d9;stroke:#cf8524;stroke-width:2}</style></defs>
<rect width="1120" height="1140" fill="#f3f6fa"/>
<text x="45" y="52" class="t">IBN + 单层 KAN + 边缘分支</text>
<text x="45" y="83" class="s">两项新模块都在 P3 之后、原语义分类器之前；输入以 1024 × 1024 为例</text>
<rect x="45" y="110" width="1030" height="91" rx="12" class="b"/>
<text x="68" y="145" class="h">图像 → 已训练 IBN 骨干与颈部 → P3（model[16]）</text>
<text x="68" y="177" class="m">[B,3,1024,1024]                            x: [B,64,128,128]</text>
<path d="M430 201V257" class="w"/>
<path d="M430 228H100V473H403" class="w"/><text x="62" y="356" class="h">x</text>
<rect x="210" y="263" width="440" height="158" rx="12" class="k"/>
<text x="237" y="295" class="h">单层 KAN 残差适配器</text>
<text x="237" y="329" class="s">1×1 Conv 64→16 → SiLU</text>
<text x="237" y="359" class="s">展平空间位置 → KAN(16→16) → 还原</text>
<text x="237" y="390" class="s">1×1 Conv 16→64（零初始化输出投影）</text>
<path d="M430 421V447" class="w"/>
<circle cx="430" cy="473" r="23" fill="white" stroke="#53687b" stroke-width="2"/><text x="430" y="481" text-anchor="middle" class="t">+</text>
<text x="478" y="480" class="m">z: [B,64,128,128]</text>
<path d="M430 497V542" class="w"/>
<path d="M430 519H100V785H403" class="w"/><text x="62" y="663" class="h">z</text>
<rect x="210" y="548" width="440" height="70" rx="12" class="e"/>
<text x="237" y="578" class="h">边缘特征：3×3 Conv 64→16 → SiLU</text>
<text x="237" y="605" class="m">f: [B,16,128,128]</text>
<path d="M430 618V663" class="w"/>
<path d="M430 638H910V663" class="w"/>
<rect x="210" y="669" width="440" height="64" rx="12" class="e"/>
<text x="237" y="697" class="h">残差投影：1×1 Conv 16→64</text>
<text x="237" y="721" class="s">零初始化输出；形状 [B,64,128,128]</text>
<rect x="760" y="669" width="300" height="64" rx="12" class="e"/>
<text x="785" y="697" class="h">边界头：1×1 Conv 16→1</text>
<text x="785" y="721" class="m">[B,1,128,128]</text>
<path d="M430 733V759" class="w"/>
<circle cx="430" cy="785" r="23" fill="white" stroke="#53687b" stroke-width="2"/><text x="430" y="793" text-anchor="middle" class="t">+</text>
<text x="478" y="791" class="m">[B,64,128,128]</text>
<path d="M430 809V841" class="w"/>
<rect x="210" y="847" width="440" height="76" rx="12" class="b"/>
<text x="237" y="879" class="h">原语义分类器（冻结）</text>
<text x="237" y="908" class="m">logits: [B,5,128,128]</text>
<path d="M910 733V841" class="w"/>
<rect x="760" y="847" width="300" height="100" rx="12" class="e"/>
<text x="785" y="877" class="h">撞击坑边界辅助损失</text>
<text x="785" y="906" class="s">插值至标签尺寸，带权 BCE</text>
<text x="785" y="934" class="s">原语义损失 + 0.1 × 边界项</text>
<rect x="760" y="263" width="300" height="287" rx="12" class="b"/>
<text x="785" y="302" class="h">训练范围</text>
<text x="785" y="342" class="s">冻结：IBN、骨干、颈部、</text><text x="785" y="369" class="s">原分类器及 BN 运行统计</text>
<text x="785" y="412" class="s">更新：KAN + 边缘分支</text>
<text x="785" y="445" class="s">固定：KAN 网格和掩码</text>
<text x="785" y="485" class="s">可训练参数：15,025</text>
<text x="785" y="520" class="s">数据：只使用仿真数据</text>
<rect x="45" y="984" width="1030" height="104" rx="12" fill="#e6edf4"/>
<text x="70" y="1017" class="h">已训练底座 + 尚未训练的新分支</text>
<text x="70" y="1048" class="s">零残差初始化保证组合模型初始分割输出与 IBN best.pt 一致；小样本检查已验证冻结与梯度。</text>
<text x="70" y="1075" class="s">边缘残差参与分割预测，单通道边界头提供辅助训练监督；目前没有本组合的真实域提升结论。</text>
<text x="45" y="1120" class="s">2026-11-12 · ibn_kan_edge.py · 蓝色为 KAN，橙色为边缘分支；原文件保留</text>
</svg>
